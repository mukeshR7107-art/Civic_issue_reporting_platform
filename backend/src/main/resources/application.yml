server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: civictrack
  flyway:
    schemas: civictrack
    default-schema: civictrack
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
app:
  supabase-url: ${SUPABASE_URL}
  supabase-publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
  supabase-service-key: ${SUPABASE_SERVICE_KEY:}
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
